name: GlitchBound CI/CD

on:
  push:
    branches: [pre-release]
    paths: ['glitchbound/**', 'neon-rush/**', '.github/workflows/glitchbound.yml']
  pull_request:
    paths: ['glitchbound/**', 'neon-rush/**']
  workflow_dispatch:

concurrency:
  group: glitchbound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glitchbound
    env:
      # Same repository secrets as NEON RUSH: the token's "Cloudflare Pages: Edit" permission covers every Pages project.
      # Deployment only runs when both secrets are configured in the repository settings.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            glitchbound/package-lock.json
            neon-rush/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build && node scripts/build-games.mjs && node scripts/size-report.mjs
      - name: Apply database migrations (D1)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler d1 migrations apply glitchbound --remote
      - name: Deploy live rooms worker (Crass Act)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        # Needs "Workers Scripts: Edit" on the token; if it is missing the site still deploys and keeps the last worker.
        continue-on-error: true
        run: npx wrangler deploy --config rooms/wrangler.toml
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler pages deploy dist --project-name=glitchbound --branch=pre-release --commit-dirty=true
      - name: Deployment skipped
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "::notice::Cloudflare secrets not set; build verified but not deployed. See glitchbound/docs/DEPLOYMENT.md"
