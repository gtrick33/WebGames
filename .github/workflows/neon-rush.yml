name: NEON RUSH CI/CD

on:
  push:
    branches: [pre-release]
    paths: ['neon-rush/**', '.github/workflows/neon-rush.yml']
  pull_request:
    paths: ['neon-rush/**']
  workflow_dispatch:

concurrency:
  group: neon-rush-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-rush
    env:
      # Deployment only runs when both secrets are configured in the repository settings.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: neon-rush/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build && node scripts/size-report.mjs
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler pages deploy dist --project-name=neon-rush --branch=pre-release --commit-dirty=true
      - name: Deployment skipped
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "::notice::Cloudflare secrets not set; build verified but not deployed. See neon-rush/docs/DEPLOYMENT.md"
