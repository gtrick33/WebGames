<!doctype html>
<!-- The trailers' graphics, drawn over the footage: lines of story, name plates, the end card. The renderer
     (gfx/render.mjs) asks for one frame at a time with draw(t); the page is transparent everywhere else. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --gold: #e9c46a; --cream: #f6eedd; --ink: #0c0812; --serif: Georgia, 'Times New Roman', serif; --sans: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif; --u: calc(var(--w) / 1920); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage { position: relative; width: calc(var(--w) * 1px); height: calc(var(--h) * 1px); overflow: hidden; font-family: var(--serif); color: var(--cream); }
  #stage > div { position: absolute; will-change: opacity, transform; }
  .gilt { background: linear-gradient(180deg, #fff8dc 0%, #ffe08a 34%, #f1b541 56%, #b9731f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 calc(3px * var(--u)) calc(2px * var(--u)) rgba(0, 0, 0, 0.85)) drop-shadow(0 0 calc(22px * var(--u)) rgba(0, 0, 0, 0.6)); }
  .shadow { text-shadow: 0 calc(2px * var(--u)) calc(3px * var(--u)) rgba(0, 0, 0, 0.95), 0 0 calc(18px * var(--u)) rgba(0, 0, 0, 0.85), 0 0 calc(46px * var(--u)) rgba(0, 0, 0, 0.6); }

  /* a line of the story: one sentence, low on the picture, a soft shade behind it and nothing else */
  .line { left: 0; right: 0; bottom: 11%; text-align: center; padding: calc(90px * var(--u)) 12% calc(40px * var(--u)); background: radial-gradient(ellipse 62% 78% at 50% 62%, rgba(6, 3, 10, 0.72), rgba(6, 3, 10, 0) 72%); }
  .line.is-mid { bottom: 38%; }
  .line.is-high { bottom: auto; top: 9%; }
  .line p { margin: 0; font-size: calc(58px * var(--u)); line-height: 1.22; letter-spacing: 0.012em; }
  .line p i { color: var(--gold); font-style: italic; }
  .line small { display: block; margin-top: calc(14px * var(--u)); font: 600 calc(24px * var(--u)) / 1 var(--sans); letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold); }

  /* a name plate: a calling, a boss, a mode */
  .plate { left: 6.5%; bottom: 12%; }
  .plate.is-right { left: auto; right: 6.5%; text-align: right; }
  .plate.is-top { bottom: auto; top: 9%; }
  .plate::before { content: ''; position: absolute; inset: calc(-70px * var(--u)) calc(-150px * var(--u)); background: radial-gradient(ellipse at 50% 55%, rgba(6, 3, 10, 0.7), rgba(6, 3, 10, 0) 70%); z-index: -1; }
  .plate h1 { margin: 0; font-size: calc(118px * var(--u)); line-height: 1; font-weight: 700; letter-spacing: 0.035em; font-variant: small-caps; }
  .plate h2 { margin: calc(12px * var(--u)) 0 0; font: 600 calc(29px * var(--u)) / 1.2 var(--sans); letter-spacing: 0.3em; text-transform: uppercase; color: var(--cream); }
  .plate .rule { height: calc(3px * var(--u)); width: calc(150px * var(--u)); margin: calc(16px * var(--u)) 0 0; background: linear-gradient(90deg, var(--accent, var(--gold)), transparent); }
  .plate.is-right .rule { margin-left: auto; background: linear-gradient(270deg, var(--accent, var(--gold)), transparent); }
  .plate.is-small h1 { font-size: calc(78px * var(--u)); }
  .plate.is-small h2 { font-size: calc(24px * var(--u)); }

  /* the words in the middle of the picture, for a turn in the trailer */
  .big { left: 0; right: 0; top: 50%; text-align: center; }
  .big::before { content: ''; position: absolute; inset: calc(-160px * var(--u)) 8%; background: radial-gradient(ellipse at 50% 50%, rgba(6, 3, 10, 0.78), rgba(6, 3, 10, 0) 70%); z-index: -1; }
  .big h1 { margin: 0; font-size: calc(124px * var(--u)); line-height: 1.02; font-weight: 700; letter-spacing: 0.05em; font-variant: small-caps; }
  .big h2 { margin: calc(20px * var(--u)) 0 0; font: 600 calc(32px * var(--u)) / 1.2 var(--sans); letter-spacing: 0.34em; text-transform: uppercase; }

  /* a small standing note in a corner */
  .chip { left: 3.2%; top: 5%; font: 700 calc(25px * var(--u)) / 1 var(--sans); letter-spacing: 0.3em; text-transform: uppercase; padding: calc(13px * var(--u)) calc(20px * var(--u)) calc(12px * var(--u)) calc(22px * var(--u)); background: rgba(10, 6, 16, 0.62); border-left: calc(4px * var(--u)) solid var(--gold); color: var(--cream); }
  .chip.is-right { left: auto; right: 3.2%; }
  .chip.is-low { top: auto; bottom: 5%; }
  .chip b { color: var(--gold); font-weight: 700; }
  .mark { right: 3%; top: 4.2%; width: calc(250px * var(--u)); opacity: 0.92; filter: drop-shadow(0 calc(2px * var(--u)) calc(6px * var(--u)) rgba(0, 0, 0, 0.8)); }
  .mark.is-left { right: auto; left: 3%; }
  .mark.is-low { top: auto; bottom: 4.6%; }
  .mark svg { width: 100%; height: auto; display: block; }

  .veil { inset: 0; background: #06030a; }
  .veil.is-white { background: #fff6dc; }
  .vignette { inset: 0; background: radial-gradient(ellipse 78% 78% at 50% 50%, rgba(0, 0, 0, 0) 58%, rgba(4, 2, 8, 0.5) 100%); }

  /* a thumbnail's lockup: the logo and a title, low and left over a frame of the game */
  .thumb { inset: 0; background: linear-gradient(20deg, rgba(6, 3, 10, 0.92) 0%, rgba(6, 3, 10, 0.55) 34%, rgba(6, 3, 10, 0) 62%); }
  .thumb .lock { position: absolute; left: 4.5%; bottom: 7%; width: 60%; }
  .thumb .logo { filter: drop-shadow(0 calc(8px * var(--u)) calc(24px * var(--u)) rgba(0, 0, 0, 0.9)); }
  .thumb .logo svg { width: 72%; height: auto; display: block; }
  .thumb h1 { margin: calc(26px * var(--u)) 0 0; font-size: calc(84px * var(--u)); line-height: 1; font-weight: 700; letter-spacing: 0.04em; font-variant: small-caps; white-space: nowrap; }
  .thumb h2 { margin: calc(14px * var(--u)) 0 0; font: 700 calc(36px * var(--u)) / 1.2 var(--sans); letter-spacing: 0.26em; text-transform: uppercase; }

  /* the end card */
  .end { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse 70% 70% at 50% 46%, rgba(10, 5, 20, 0.5), rgba(5, 2, 10, 0.9) 100%); }
  .end .logo { width: calc(1040px * var(--u)); filter: drop-shadow(0 calc(10px * var(--u)) calc(30px * var(--u)) rgba(0, 0, 0, 0.9)) drop-shadow(0 0 calc(70px * var(--u)) rgba(255, 190, 80, 0.28)); }
  .end .logo svg { width: 100%; height: auto; display: block; }
  .end .kick { font: 700 calc(22px * var(--u)) / 1 var(--sans); letter-spacing: 0.56em; text-transform: uppercase; color: var(--gold); margin-bottom: calc(20px * var(--u)); padding-left: 0.56em; }
  .end .tag { margin-top: calc(30px * var(--u)); font-size: calc(46px * var(--u)); font-style: italic; letter-spacing: 0.02em; }
  .end .cta { text-transform: uppercase; margin-top: calc(58px * var(--u)); font: 800 calc(58px * var(--u)) / 1 var(--sans); letter-spacing: 0.13em; padding-left: 0.13em; }
  .end .url { margin-top: calc(22px * var(--u)); font: 600 calc(44px * var(--u)) / 1 var(--sans); letter-spacing: 0.05em; color: var(--cream); }
  .end .note { margin-top: calc(22px * var(--u)); font: 600 calc(24px * var(--u)) / 1 var(--sans); letter-spacing: 0.3em; text-transform: uppercase; color: #cbbd9f; padding-left: 0.3em; }
  .end .credit { position: absolute; left: 0; right: 0; bottom: calc(30px * var(--u)); font: 500 calc(17px * var(--u)) / 1.3 var(--sans); letter-spacing: 0.08em; color: rgba(236, 226, 205, 0.62); }

  /* upright (9:16): the footage sits in the middle band, the words above and below it */
  .v .line { bottom: 3.2%; padding-top: calc(40px * var(--u)); padding-bottom: calc(20px * var(--u)); padding-left: 7%; padding-right: 7%; }
  .v .line p { font-size: calc(88px * var(--u)); }
  .v .line small { font-size: calc(40px * var(--u)); }
  .v .line.is-high, .v .line.is-mid { top: auto; bottom: 3.2%; }
  .v .plate, .v .plate.is-right, .v .plate.is-top { left: 0; right: 0; top: auto; bottom: 3.6%; text-align: center; }
  .v .plate h1 { font-size: calc(190px * var(--u)); }
  .v .plate.is-small h1 { font-size: calc(140px * var(--u)); }
  .v .plate h2, .v .plate.is-small h2 { font-size: calc(46px * var(--u)); letter-spacing: 0.22em; }
  .v .plate .rule, .v .plate.is-right .rule { margin: calc(26px * var(--u)) auto 0; width: calc(300px * var(--u)); background: linear-gradient(90deg, transparent, var(--accent, var(--gold)), transparent); }
  .v .big h1 { font-size: calc(190px * var(--u)); padding: 0 5%; }
  .v .big h2 { font-size: calc(48px * var(--u)); padding: 0 6%; }
  .v .chip, .v .chip.is-right, .v .chip.is-low { left: 50%; right: auto; top: 10.4%; bottom: auto; transform-origin: center; font-size: calc(40px * var(--u)); margin-left: 0; translate: -50% 0; white-space: nowrap; }
  .v .mark, .v .mark.is-left, .v .mark.is-low { left: 50%; right: auto; bottom: auto; top: 2.6%; width: calc(640px * var(--u)); translate: -50% 0; }
  .v .end .logo { width: calc(1650px * var(--u)); }
  .v .end .kick { font-size: calc(38px * var(--u)); }
  .v .end .tag { font-size: calc(84px * var(--u)); padding: 0 6%; }
  .v .end .cta { font-size: calc(104px * var(--u)); line-height: 1.12; padding: 0 5%; margin-top: calc(110px * var(--u)); }
  .v .end .url { font-size: calc(64px * var(--u)); margin-top: calc(44px * var(--u)); }
  .v .end .note { font-size: calc(40px * var(--u)); margin-top: calc(40px * var(--u)); }
  .v .end .credit { font-size: calc(28px * var(--u)); bottom: calc(60px * var(--u)); padding: 0 6%; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  let items = [];
  let logo = '';
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  /** Words with *gold* in them. */
  const rich = (s) => esc(s).replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/\n/g, '<br>');

  /** Each copy of the logo gets gradients of its own (a hidden copy's gradients paint nothing). */
  let copies = 0;
  const own = (svg) => {
    const k = ++copies;
    return svg.replace(/id="([a-z])"/g, `id="$1${k}"`).replace(/url\(#([a-z])\)/g, `url(#$1${k})`);
  };
  const html = (it) => {
    switch (it.kind) {
      case 'line': return `<p class="shadow">${rich(it.text)}</p>${it.sub ? `<small class="shadow">${esc(it.sub)}</small>` : ''}`;
      case 'plate': return `<h1 class="gilt">${esc(it.title)}</h1>${it.sub ? `<h2 class="shadow">${esc(it.sub)}</h2>` : ''}<div class="rule"></div>`;
      case 'big': return `<h1 class="gilt">${rich(it.title)}</h1>${it.sub ? `<h2 class="shadow">${esc(it.sub)}</h2>` : ''}`;
      case 'chip': return rich(it.text).replace(/<i>/g, '<b>').replace(/<\/i>/g, '</b>');
      case 'mark': return own(logo);
      case 'thumb': return `<div class="lock"><div class="logo">${own(logo)}</div><h1 class="gilt">${esc(it.title)}</h1>${it.sub ? `<h2 class="shadow">${esc(it.sub)}</h2>` : ''}</div>`;
      case 'end': return `${it.kick ? `<div class="kick shadow">${esc(it.kick)}</div>` : ''}<div class="logo">${own(logo)}</div>${it.tag ? `<div class="tag shadow">${esc(it.tag)}</div>` : ''}<div class="cta gilt">${rich(it.cta)}</div><div class="url shadow">${esc(it.url)}</div>${it.note ? `<div class="note shadow">${esc(it.note)}</div>` : ''}${it.credit ? `<div class="credit">${esc(it.credit)}</div>` : ''}`;
      default: return '';
    }
  };
  const cls = (it) => [it.kind, it.pos ? `is-${it.pos}` : '', it.side ? `is-${it.side}` : '', it.small ? 'is-small' : '', it.white ? 'is-white' : ''].filter(Boolean).join(' ');

  window.setup = (spec) => {
    items = spec.items;
    logo = spec.logo;
    document.documentElement.style.setProperty('--w', spec.w);
    document.documentElement.style.setProperty('--h', spec.h);
    stage.className = spec.upright ? 'v' : '';
    stage.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = cls(it);
      el.innerHTML = html(it);
      if (it.accent) el.style.setProperty('--accent', it.accent);
      el.style.display = 'none';
      stage.append(el);
      it.el = el;
      it.i = i;
    });
  };

  /** Draws the frame at `t` seconds; returns a signature that only changes when the picture does. */
  window.draw = (t) => {
    const sig = [];
    for (const it of items) {
      const on = t >= it.at && t < it.at + it.dur;
      it.el.style.display = on ? '' : 'none';
      if (!on) continue;
      const fin = it.in ?? (it.kind === 'veil' || it.kind === 'vignette' ? 0 : it.kind === 'plate' ? 0.16 : 0.45);
      const fout = it.out ?? (it.kind === 'veil' || it.kind === 'vignette' ? 0 : it.kind === 'plate' ? 0.14 : 0.4);
      const a = fin ? clamp((t - it.at) / fin) : 1;
      const b = fout ? clamp((it.at + it.dur - t) / fout) : 1;
      let o = Math.min(a, b) * (it.alpha ?? 1);
      let tf = '';
      const life = (t - it.at) / it.dur;
      if (it.kind === 'plate') {
        const s = (1 - ease(a)) * (it.side === 'right' ? 34 : -34);
        tf = stage.className === 'v' ? `translateY(${(1 - ease(a)) * 26}px)` : `translateX(${s}px)`;
      } else if (it.kind === 'line') tf = `translateY(${(1 - ease(a)) * 14}px)`;
      else if (it.kind === 'big') tf = `translateY(-50%) scale(${1.06 - 0.06 * ease(a * 1.0) + life * 0.025})`;
      else if (it.kind === 'end') {
        const lg = it.el.querySelector('.logo');
        lg.style.transform = `scale(${1.1 - 0.1 * ease((t - it.at) / 1.1) + (t - it.at) * 0.004})`;
        // the logo first, then the words under it one after another
        [...it.el.children].forEach((c) => {
          const order = { kick: 0.25, logo: 0, tag: 0.55, cta: 1.0, url: 1.25, note: 1.5, credit: 1.8 }[c.className.split(' ')[0]] ?? 0;
          c.style.opacity = String(ease((t - it.at - order) / 0.5));
        });
      } else if (it.kind === 'veil' && it.curve) {
        // a veil that comes or goes: 'in' lifts from dark, 'out' falls to it, 'blink' there and back
        o = (it.alpha ?? 1) * (it.curve === 'in' ? 1 - life : it.curve === 'out' ? life : 1 - Math.abs(life * 2 - 1));
      }
      it.el.style.opacity = o.toFixed(4);
      it.el.style.transform = tf;
      sig.push(`${it.i}:${o.toFixed(4)}:${tf}:${it.kind === 'end' ? (t - it.at).toFixed(3) : ''}`);
    }
    return sig.join('|');
  };
</script>
</body>
</html>
