<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0522" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--gb:head-->
    <title>GlitchBound</title>
    <!--/gb:head-->
    <script>
      // Arcade entrance: cover the page from the very first paint, so the landing page never flashes
      // before the cabinet animation (the app removes this as soon as the entrance is on screen).
      (function () {
        try {
          var p = location.pathname;
          if ((p === '/' || p === '/index.html') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('entrance-pending');
            setTimeout(function () { document.documentElement.classList.remove('entrance-pending'); }, 4000);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.entrance-pending::after { content: ''; position: fixed; inset: 0; z-index: 299; background: radial-gradient(ellipse at 50% 35%, #2a0b56 0%, #0b031f 60%, #05010f 100%); }
      /* Fallback content for crawlers and no-JS visitors; replaced by the app on load. */
      html { background: #0d0522; color: #f6f1ff; }
      body { margin: 0; font: 17px/1.55 system-ui, sans-serif; }
      .ssr { max-width: 760px; margin: 0 auto; padding: 120px 20px 60px; }
      .ssr h1 { font-size: 44px; line-height: 1; letter-spacing: -0.03em; }
    </style>
  </head>
  <body>
    <div id="root"></div><!--/root-->
    <noscript><p style="text-align:center;padding:20px">GlitchBound needs JavaScript to run its games.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
